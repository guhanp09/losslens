[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "losslens"
version = "0.1.0"
readme = "README.md"
description = "Motor insurance frequency, severity, and loss-cost diagnostics"
requires-python = ">=3.11"
authors = [{name = "Guhan Purushothaman"}]
dependencies = ["numpy>=2,<2.4", "pandas", "scipy", "scikit-learn", "requests", "pyarrow", "streamlit", "plotly", "reportlab", "xlsxwriter"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
losslens = "losslens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
